<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>星言 · 深色桌面预览</title>
  <link rel="stylesheet" href="preview.css?v=cosmos-black">
  <script src="preview.js?v=cosmos-black" defer></script>
</head>
<body>
  <main class="app-shell" aria-label="星言深色桌面交互页面">
    <aside class="preview-rail">
      <img src="assets/xingyan.png" alt="">
      <button type="button" class="rail-action active" data-preview-rail="chat" aria-label="Star chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l1.7 5.1a3.8 3.8 0 0 0 2.3 2.3l5.1 1.7-5.1 1.7a3.8 3.8 0 0 0-2.3 2.3L12 21.4l-1.7-5.1a3.8 3.8 0 0 0-2.3-2.3l-5.1-1.7 5.1-1.7a3.8 3.8 0 0 0 2.3-2.3L12 3.2z"/></svg>
      </button>
      <button type="button" class="rail-action" data-preview-rail="contacts" aria-label="通讯录">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.8 19c.5-4.1 2.3-6.1 5.2-6.1s4.7 2 5.2 6.1M15.5 7.2a2.5 2.5 0 1 1 0 5M15 13.2c3 0 4.7 1.8 5.2 5.2"/></svg>
      </button>
      <button type="button" class="rail-action" data-preview-rail="world" aria-label="世界">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5c2.4 2.7 3.6 5.5 3.6 8.5S14.4 17.8 12 20.5M12 3.5C9.6 6.2 8.4 9 8.4 12s1.2 5.8 3.6 8.5"/></svg>
      </button>
      <button type="button" class="rail-action" data-preview-rail="files" aria-label="文件">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l2-2h9v13h-17z"/></svg>
      </button>
      <span></span>
      <b class="rail-avatar">C</b>
    </aside>

    <section class="preview-list" aria-label="会话列表演示">
      <header><b>Star chat</b><span>＋</span></header>
      <label class="preview-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2L21 21"/></svg>
        <input data-preview-search type="search" placeholder="搜索" aria-label="搜索演示会话">
      </label>
      <div class="preview-filters" aria-label="会话筛选演示">
        <button type="button" data-preview-filter="all" aria-pressed="true" aria-label="全部">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H9l-5 4V4z"/></svg>
        </button>
        <button type="button" data-preview-filter="unread" aria-pressed="false" aria-label="未读">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.5-2.5V10a4.5 4.5 0 0 0-9 0v4.5L6 17zM10 19.5a2.2 2.2 0 0 0 4 0"/></svg>
        </button>
        <button type="button" data-preview-filter="group" aria-pressed="false" aria-label="群聊">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.2"/><path d="M3.8 18.5c.5-3.8 2.2-5.7 5.2-5.7s4.7 1.9 5.2 5.7M14.3 13.5c2.7 0 4.3 1.7 4.8 5"/></svg>
        </button>
        <button type="button" data-preview-filter="pinned" aria-pressed="false" aria-label="置顶">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l-1.2 5 3.2 3.2H6l3.2-3.2L8 4zM12 12.2V20"/></svg>
        </button>
      </div>
      <button type="button" class="preview-chat-row active" data-preview-chat="design" data-kind="group" data-unread="0" data-pinned="true">
        <span class="preview-avatar blue">设</span><div><b>设计协作</b><small>新的方案已经上传</small></div><time>现在</time>
      </button>
      <button type="button" class="preview-chat-row" data-preview-chat="family" data-kind="group" data-unread="2" data-pinned="false">
        <span class="preview-avatar green">家</span><div><b>家人群</b><small>妈妈：今晚早点回来</small></div><time>18:24</time>
      </button>
      <button type="button" class="preview-chat-row" data-preview-chat="official" data-kind="direct" data-unread="0" data-pinned="false">
        <span class="preview-avatar gray">星</span><div><b>星言官方</b><small>欢迎来到 Star chat</small></div><time>周二</time>
      </button>
    </section>

    <section class="preview-chat">
      <header class="preview-chat-head">
        <span class="preview-avatar blue" data-preview-avatar>设</span>
        <div><b data-preview-name>设计协作</b><small><i></i><span data-preview-status>8 位成员</span></small></div>
        <nav>
          <button type="button" data-preview-head="history" aria-label="聊天记录"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg></button>
          <button type="button" data-preview-head="search" aria-label="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2L21 21"/></svg></button>
          <button type="button" data-preview-head="phone" aria-label="语音通话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.5l3 1.3-1.1 3.1 5 5 3.1-1.1 1.3 3c-1 1.8-2.5 2.7-4.5 2.2-5.1-1.2-9.2-5.3-10.4-10.4-.5-2 .4-3.5 2.2-4.5z"/></svg></button>
          <button type="button" data-preview-head="video" aria-label="视频通话"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6.5" width="12" height="11" rx="2"/><path d="M15.5 10l5-3v10l-5-3"/></svg></button>
          <button type="button" data-preview-head="more" aria-label="更多"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        </nav>
      </header>
      <div class="preview-messages">
        <time class="preview-day">今天</time>
        <div class="preview-message-list" data-preview-message-list></div>
      </div>
      <div class="preview-composer">
        <button type="button" data-preview-action="emoji" aria-label="表情"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r=".8"/><circle cx="15" cy="10" r=".8"/><path d="M8.5 14c1.8 2 5.2 2 7 0"/></svg></button>
        <button type="button" data-preview-action="plus" aria-label="更多"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <input data-preview-input type="text" maxlength="80" placeholder="建立你的星友连接" aria-label="输入消息演示">
        <button type="button" class="preview-send" data-preview-send aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5L20 4l-5.8 16-2.5-6.2-8.2-2.3z"/><path d="M11.7 13.8L20 4"/></svg></button>
      </div>
    </section>
  </main>
  <p class="preview-status" aria-live="polite">可直接操作深色预览</p>
</body>
</html>
