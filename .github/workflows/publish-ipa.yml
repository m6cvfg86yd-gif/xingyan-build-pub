name: publish-ipa

on:
  workflow_dispatch:
  push:
    branches:
      - feature/shard-shadow-hooks
    paths:
      - .github/workflows/publish-ipa.yml

jobs:
  publish:
    runs-on: macos-15-intel
    steps:
      - name: Download and decrypt package
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/ipa-payload
          mkdir -p /tmp/ipa-payload
          gh release download ipa-20261113-050107 \
            --repo m6cvfg86yd-gif/xingyan-build-pub \
            --pattern Luchat.ipa.enc \
            --dir /tmp/ipa-payload
          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/ipa-payload/Luchat.ipa.enc \
            -out /tmp/ipa-payload/Luchat.ipa \
            -pass env:IPA_PASSWORD
          unzip -t /tmp/ipa-payload/Luchat.ipa
          rm /tmp/ipa-payload/Luchat.ipa.enc

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          cat > /tmp/ssh_config <<'EOF'
          Host jump
            HostName 103.233.254.147
            User root
            IdentityFile /tmp/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 10

          Host front
            HostName 43.242.194.89
            User root
            IdentityFile /tmp/deploy_key
            ProxyJump jump
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 10
          EOF
          cat > /tmp/ipa-payload/diagnose.js <<'NODE'
          const fs = require('fs');
          const data = '/opt/chris/app/data';
          const users = JSON.parse(fs.readFileSync(data + '/users.json', 'utf8')).users || [];
          const chats = JSON.parse(fs.readFileSync(data + '/chats.json', 'utf8')).chats || [];
          const user = users.find((row) => row.username === 'wzy245441545');
          for (const chat of chats) {
            if (!user || !Array.isArray(chat.memberIds) || !chat.memberIds.includes(user.id)) continue;
            if (!String(chat.name || '').includes('家人')) continue;
            console.log(JSON.stringify({
              id: chat.id,
              name: chat.name,
              hiddenForUser: Array.isArray(chat.hiddenFor) && chat.hiddenFor.includes(user.id),
              dismissed: chat.dismissed === true,
              members: chat.memberIds.length
            }));
          }
          NODE

      - name: Publish and verify
        run: |
          set -euo pipefail
          tar -C /tmp/ipa-payload -czf /tmp/ipa-payload.tgz .
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if ssh -F /tmp/ssh_config front "
              rm -rf /tmp/ipa-payload &&
              mkdir -p /tmp/ipa-payload &&
              tar -xzf - -C /tmp/ipa-payload &&
              mkdir -p /opt/chris/backups &&
              if test -f /opt/chris/app/public/Luchat.ipa; then
                cp -p /opt/chris/app/public/Luchat.ipa /opt/chris/backups/Luchat.ipa.before-65c34d2;
              fi &&
              install -m 0644 /tmp/ipa-payload/Luchat.ipa /opt/chris/app/public/Luchat.ipa &&
              sha256sum /opt/chris/app/public/Luchat.ipa &&
              node /tmp/ipa-payload/diagnose.js &&
              grep \"AML_RUNTIME_ENABLED\" /etc/systemd/system/chris-shard@.service.d/50-baseline-lock.conf &&
              journalctl -u chris-shard@0.service -n 80 --no-pager | grep AML | tail -5
            " < /tmp/ipa-payload.tgz; then
              ok=1
              break
            fi
            echo "SSH attempt $attempt failed; retrying"
            sleep 30
          done
          test "$ok" = "1"
