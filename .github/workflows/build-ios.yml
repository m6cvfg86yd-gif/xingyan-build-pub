name: build-ios

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      buildNumber:
        description: "CFBundleVersion (empty = Asia/Shanghai yymmddHHMM)"
        required: false
        default: ""
      buildDate:
        description: "BuildDate label (empty = Asia/Shanghai MM-dd HH:mm)"
        required: false
        default: ""
  push:
    branches:
      - main
      - codex/b682-ai-workspace-only
      - codex/oct28-unified-commercial

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 选 Node 24（SQLite 支付事务库）
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 选 Xcode（优先 26，没有就用最新可用的）
        run: |
          set -e
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          PICK="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$PICK" ]; then
            PICK="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
            echo "⚠️ 这台机器没有 Xcode 26，退回最新的：$PICK"
          else
            echo "用上了 Xcode 26：$PICK"
          fi
          if [ -z "$PICK" ]; then echo "机器上没有 Xcode"; exit 1; fi
          sudo xcode-select -s "$PICK" 2>/dev/null || sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 下载 WebRTC 框架
        run: |
          set -e
          if ! curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 300 -o /tmp/webrtc.zip \
              https://github.com/stasel/WebRTC/releases/download/153.0.0/WebRTC-M153.xcframework.zip; then
            echo "GitHub 下载失败，回退自家镜像"
            curl -L --fail --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 600 -o /tmp/webrtc.zip \
              https://aa.x8iu.com/webrtc/WebRTC-M153.xcframework.zip
          fi
          ls -lh /tmp/webrtc.zip
          rm -rf WebRTCKit && mkdir -p WebRTCKit
          unzip -q /tmp/webrtc.zip -d WebRTCKit
          ls WebRTCKit
          ls WebRTCKit/WebRTC.xcframework
          ls WebRTCKit/WebRTC.xcframework/ios-arm64/WebRTC.framework

      - name: 检查英文词典有没有重复 key
        run: |
          python3 - <<'PY'
          import re, collections, sys
          t = open('Sources/L10n.swift', encoding='utf-8').read()
          keys = re.findall(r'^\s{8}"((?:[^"\\]|\\.)*)":', t, re.M)
          dups = [k for k, v in collections.Counter(keys).items() if v > 1]
          print('L10n keys =', len(keys), ' duplicates =', dups)
          sys.exit(1 if dups else 0)
          PY
          python3 tools/verify-no-tencent-media.py
          python3 tools/verify-native-chat-swipe.py
          python3 tools/verify-chats-dark-surface.py
          python3 tools/verify-recall-preview.py
          python3 tools/verify-group-announce.py
          python3 tools/verify-group-top-frost.py
          python3 tools/verify-deleted-friend-send.py
          python3 tools/verify-delete-friend-navigation.py
          python3 tools/verify-plus-panel.py
          python3 tools/verify-composer-placeholder.py
          python3 tools/verify-registration-phone-only.py
          python3 tools/verify-line-registration.py
          python3 tools/verify-line-onboarding.py
          python3 tools/verify-known-device-login.py
          python3 tools/verify-chat-top-title.py
          python3 tools/verify-contacts-whatsapp.py
          python3 tools/verify-chat-list-order.py
          node server/tools/server-boot-preflight.js

      - name: 聊天接口回归
        run: |
          node server/test/security-vault.test.js
          node server/test/chat-actions.test.js
          node server/test/chat-route-plan.test.js
          node server/test/shard-user-directory.test.js
          node server/test/shard-user-router.test.js
          node server/test/shard-route-server-patch.test.js
          node server/test/shard-owner-switch.test.js
          node server/test/shard-write-freeze.test.js
          node server/test/shard-minimal-release.test.js
          node server/test/shard-release-install.test.js
          node server/test/chat-owner-routing.test.js
          node server/test/shard-maintenance.test.js
          node server/test/shard-maintenance-api.test.js
          node server/test/shard-maintenance-executor.test.js
          node server/test/shard-physical-layout.test.js
          node server/test/shard-shadow-read.test.js
          node server/test/dual-cell-contract.test.js
          node server/test/dual-cell-shadow-probe.test.js
          node server/test/dual-cell-active-plan.test.js
          node server/test/dual-cell-replication.test.js
          node server/test/dual-cell-failover-drill.test.js
          node server/test/etcd-lease.test.js
          node server/test/dual-cell-lease-agent.test.js
          node server/test/single-cell-capacity.test.js
          node server/test/single-cell-capacity-collector.test.js
          node server/test/single-cell-capacity-runner.test.js
          node server/test/manage-script-syntax.test.js
          node server/test/shard-runtime-health.test.js
          node server/test/message-sequence-audit.test.js
          node server/test/message-sequence-repair-plan.test.js
          node server/test/message-sequence-repair-apply.test.js
          node server/test/upload-reference-repair-plan.test.js
          node server/test/upload-reference-quarantine-apply.test.js
          node server/test/shard-runtime-manifest.test.js
          node server/test/shard-authority-store.test.js
          node server/test/shard-authority-migration.test.js
          node server/test/shard-authority-shadow-audit.test.js
          node server/test/shard-authority-server.test.js
          node server/test/call-audio-relay.test.js
          node server/test/call-cross-shard.test.js
          node server/test/dual-cell-call-topology.test.js
          node server/test/dual-cell-key-domain.test.js
          node server/test/payment-ledger.test.js
          node server/test/payment-database.test.js
          node server/test/payment-database-concurrency.test.js
          node server/test/payment-provider-server.test.js

      - name: 客户端本地事务库测试
        run: python3 tools/test-local-client-storage.py

      - name: 校验星核邮差表情资产
        run: python3 tools/verify_nova_emojis.py

      - name: 校验核心模块
        run: bash tools/verify-core.sh

      - name: 编译原生 App
        id: build
        run: |
          set -e
          BUILDDATE="${BUILD_DATE_INPUT:-$(TZ=Asia/Shanghai date '+%m-%d %H:%M')}"
          BUILDNO="${BUILD_NUMBER_INPUT:-$(TZ=Asia/Shanghai date '+%y%m%d%H%M')}"
          echo "构建号 = $BUILDNO"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILDNO" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :BuildDate string $BUILDDATE" Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :BuildDate $BUILDDATE" Info.plist || true
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          APP="Payload/CHRISChat.app"
          rm -rf Payload
          mkdir -p "$APP"
          cp Info.plist "$APP/Info.plist"
          cp AppIcon60x60@2x.png "$APP/"
          cp AppIcon60x60@3x.png "$APP/"
          cp splash.jpg "$APP/"
          cp moments-cover.jpg "$APP/"
          cp PrivacyInfo.xcprivacy "$APP/PrivacyInfo.xcprivacy"
          cp levelicons/*.png "$APP/"
          mkdir -p "$APP/emoji/nova-courier"
          cp server/public/emoji/nova-courier/*.gif "$APP/emoji/nova-courier/"
          cp server/public/emoji/nova-courier/pack.json "$APP/emoji/nova-courier/"
          mkdir -p Assets.xcassets/LaunchBg.colorset
          cat > Assets.xcassets/Contents.json <<'JSON'
          { "info": { "version": 1, "author": "xcode" } }
          JSON
          cat > Assets.xcassets/LaunchBg.colorset/Contents.json <<'JSON'
          {
            "colors": [
              {
                "idiom": "universal",
                "color": {
                  "color-space": "srgb",
                  "components": { "red": "0.016", "green": "0.031", "blue": "0.024", "alpha": "1.000" }
                }
              }
            ],
            "info": { "version": 1, "author": "xcode" }
          }
          JSON
          xcrun actool Assets.xcassets --compile "$APP" --platform iphoneos \
            --target-device iphone --minimum-deployment-target 16.0 \
            --output-format human-readable-text > /dev/null 2>&1 \
            || echo "actool 跳过：启动屏用系统默认底色"
          ls -la "$APP" | head -20
          xcrun -sdk iphoneos metal -c Sources/VoiceOrb.metal -o /tmp/VoiceOrb.air
          xcrun -sdk iphoneos metallib /tmp/VoiceOrb.air -o "$APP/default.metallib"
          ls -lh "$APP/default.metallib"
          mkdir -p "$APP/Frameworks"
          cp -R WebRTCKit/WebRTC.xcframework/ios-arm64/WebRTC.framework "$APP/Frameworks/WebRTC.framework"
          xcrun --sdk iphoneos swiftc \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -swift-version 5 \
            -parse-as-library \
            -O \
            -whole-module-optimization \
            -F "$SDK/System/Library/Frameworks" \
            -F WebRTCKit/WebRTC.xcframework/ios-arm64 \
            -o "$APP/CHRIS" \
            Sources/*.swift \
            -framework SwiftUI -framework UIKit -framework Foundation \
            -framework LocalAuthentication -framework AVFoundation \
            -framework WebRTC \
            -framework AudioToolbox -framework CoreTelephony -framework CoreMedia \
            -framework MediaPlayer -framework MessageUI -framework CarPlay \
            -framework CoreVideo -framework VideoToolbox -framework MetalKit -framework Metal \
            -framework Accelerate -framework SystemConfiguration -framework ReplayKit \
            -framework MultipeerConnectivity \
            -framework CoreGraphics -framework QuartzCore -framework OpenGLES \
            -framework Security -framework CryptoKit -framework Contacts \
            -Xlinker -dead_strip \
            -lz -lsqlite3 -lc++ \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks 2>&1 | tee /tmp/build.log
          if grep -q "error:" /tmp/build.log; then
            grep -E "error:" /tmp/build.log | head -40 > build-error.txt
            echo "==== 编译错误（已存成 artifact）===="
            cat build-error.txt
            exit 1
          fi
          echo "编译完成，体积："
          ls -lh "$APP/CHRIS"
          echo "依赖了哪些动态库："
          otool -L "$APP/CHRIS" | head -12
          echo "=== 动态库自检 ==="
          MISSING=0
          for BIN in "$APP/CHRIS" "$APP"/Frameworks/*.framework/*; do
            [ -f "$BIN" ] || continue
            otool -L "$BIN" | tail -n +2 | awk '{print $1}' | grep '^@rpath/' | while read -r DEP; do
              NAME="$(basename "$DEP")"
              if ! ls "$APP"/Frameworks/*/"$NAME" >/dev/null 2>&1; then
                echo "缺少动态库: $DEP（被 $(basename "$BIN") 依赖）"
                exit 1
              fi
            done || MISSING=1
          done
          if [ "$MISSING" != "0" ]; then echo "自检没通过：包里的动态库不全"; exit 1; fi
          echo "自检通过：包里所有 @rpath 依赖都在"

          for NAME in WebRTC; do
            rm -rf "$APP/Frameworks/$NAME.framework/Headers" \
                   "$APP/Frameworks/$NAME.framework/Modules" \
                   "$APP/Frameworks/$NAME.framework/PrivateHeaders"
          done
          strip -x -S "$APP/CHRIS" || true
          for NAME in WebRTC; do
            [ -f "$APP/Frameworks/$NAME.framework/$NAME" ] && strip -x -S "$APP/Frameworks/$NAME.framework/$NAME" || true
          done
          echo "瘦身后："
          ls -lh "$APP/CHRIS"
          du -sh "$APP"
          BJ_STAMP="$(TZ=Asia/Shanghai date '+%Y%m%d%H%M.%S')"
          echo "包内时间戳 -> $BJ_STAMP（北京时间）"
          find Payload -exec touch -t "$BJ_STAMP" {} +
          zip -qry CHRISChat-unsigned.ipa Payload
          ls -lh CHRISChat-unsigned.ipa
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in CHRISChat-unsigned.ipa -out Luchat.ipa.enc \
            -pass pass:"$IPA_PASSWORD"
          ls -lh Luchat.ipa.enc
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
          BUILD_NUMBER_INPUT: ${{ inputs.buildNumber }}
          BUILD_DATE_INPUT: ${{ inputs.buildDate }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: CHRISChat-unsigned-ipa
          path: Luchat.ipa.enc
          if-no-files-found: error
          retention-days: 1

      - name: 发布到 Release（不吃 Actions 产物配额）
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="ipa-$(date -u +%Y%m%d-%H%M%S)"
          TITLE="iOS 包 $(git log -1 --pretty=%s | cut -c1-60)"
          gh release create "$TAG" Luchat.ipa.enc \
            --title "$TITLE" \
            --notes "自动出包（commit $(git rev-parse --short HEAD)）。文件是加密的 Luchat.ipa.enc，解密见 README / 怎么出包.md。" \
            --repo "$GITHUB_REPOSITORY"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | tail -n +4 | while read -r t; do gh release delete "$t" --yes --repo "$GITHUB_REPOSITORY" || true; done

      - name: 上传编译错误
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error
          path: build-error.txt
          if-no-files-found: ignore
          retention-days: 3
