name: hotfix-deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          cat > /tmp/ssh_config <<'EOF'
          Host jump
            HostName 103.233.254.147
            User root
            IdentityFile /tmp/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 10

          Host front
            HostName 43.242.194.89
            User root
            IdentityFile /tmp/deploy_key
            ProxyJump jump
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 10
          EOF

      - name: Deploy server and restore family group
        run: |
          set -euo pipefail
          rm -rf /tmp/hotfix-payload
          mkdir -p /tmp/hotfix-payload
          cp server/server.js /tmp/hotfix-payload/server-aml-off.js
          cat > /tmp/hotfix-payload/deploy.sh <<'REMOTE'
          set -euo pipefail
          BASE=/tmp/hotfix-payload
          node --check "$BASE/server-aml-off.js"
          systemctl stop chris-watchdog.service 2>/dev/null || true
          systemctl stop chris-shard@0.service chris-shard@1.service chris-shard@2.service chris-shard@3.service chris-shard@4.service chris-shard@5.service

          node - <<'NODE'
          const fs = require('fs');
          const data = '/opt/chris/app/data';
          const users = JSON.parse(fs.readFileSync(data + '/users.json', 'utf8')).users || [];
          const chats = JSON.parse(fs.readFileSync(data + '/chats.json', 'utf8')).chats || [];
          const user = users.find((row) => row.username === 'wzy245441545');
          if (!user) throw new Error('family group user not found');
          const chat = chats.find((row) =>
            row && row.type === 'group' && String(row.name || '').trim() === '家人群'
            && Array.isArray(row.memberIds) && row.memberIds.includes(user.id)
          );
          if (!chat) throw new Error('家人群 not found');
          const reads = JSON.parse(fs.readFileSync(data + '/reads.json', 'utf8'));
          reads.cleared = reads.cleared || {};
          reads.cleared[user.id] = reads.cleared[user.id] || {};
          delete reads.cleared[user.id][chat.id];
          const temp = data + '/reads.json.deploy.tmp';
          fs.writeFileSync(temp, JSON.stringify(reads));
          fs.renameSync(temp, data + '/reads.json');
          console.log('FAMILY_CHAT', chat.id, 'members', chat.memberIds.length);
          console.log('RESTORED_CLEAR_CURSOR');
          NODE

          node - <<'NODE'
          const fs = require('fs');
          const data = '/opt/chris/app/data';
          const baseFile = data + '/moments.json';
          const logFile = data + '/moments-log.jsonl';
          const base = JSON.parse(fs.readFileSync(baseFile, 'utf8'));
          const rows = Array.isArray(base.moments) ? base.moments : [];
          const ids = new Set(rows.map((row) => row.id));
          for (const line of fs.readFileSync(logFile, 'utf8').split('\n')) {
            if (!line.trim()) continue;
            try {
              const row = JSON.parse(line);
              if (!row.id || ids.has(row.id)) continue;
              if (/^(真机回归|自动回归)-/.test(String(row.content || ''))) continue;
              rows.push(row);
              ids.add(row.id);
            } catch (_) {}
          }
          const temp = baseFile + '.merge.tmp';
          fs.writeFileSync(temp, JSON.stringify({ moments: rows }));
          fs.renameSync(temp, baseFile);
          fs.writeFileSync(logFile, '');
          console.log('MOMENTS_BASE', rows.length);
          NODE

          install -m 0644 "$BASE/server-aml-off.js" /opt/chris/app/server.js
          DROPIN=/etc/systemd/system/chris-shard@.service.d/50-baseline-lock.conf
          mkdir -p "$(dirname "$DROPIN")"
          grep -q '^Environment=AML_RUNTIME_ENABLED=0$' "$DROPIN" 2>/dev/null \
            || printf '%s\n' 'Environment=AML_RUNTIME_ENABLED=0' >> "$DROPIN"
          systemctl daemon-reload
          systemctl start chris-shard@0.service
          for i in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:5299/api/health || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "${code:-000}" = "200" ]
          systemctl start chris-shard@1.service chris-shard@2.service chris-shard@3.service chris-shard@4.service chris-shard@5.service
          systemctl start chris-watchdog.service 2>/dev/null || true
          sleep 3
          sha256sum /opt/chris/app/server.js
          for n in 0 1 2 3 4 5; do
            port=$((5299 + n * 100))
            printf 'shard%s=' "$n"
            curl -sS -o /dev/null -w '%{http_code} ' --max-time 4 "http://127.0.0.1:$port/api/health"
          done
          echo
          curl -kLsS -o /dev/null -w 'PUBLIC=%{http_code}\n' --max-time 8 https://127.0.0.1:8443/api/health
          REMOTE
          tar -C /tmp/hotfix-payload -czf /tmp/hotfix-payload.tgz .
          tar -C /tmp/hotfix-payload -tzf /tmp/hotfix-payload.tgz
          timeout 300 sh -c '
            cat /tmp/hotfix-payload.tgz |
            ssh -F /tmp/ssh_config front "
              rm -rf /tmp/hotfix-payload &&
              mkdir -p /tmp/hotfix-payload &&
              tar -xzf - -C /tmp/hotfix-payload &&
              bash /tmp/hotfix-payload/deploy.sh
            "
          '
